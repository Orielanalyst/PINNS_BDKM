# Pilot mode. Matrix: 3 branches x 2 parameter sets x 3 methods x 5 seeds = 90 runs.
# NOTE: network/collocation sizes are CPU-scaled (this machine: 4 cores, no GPU).
# The task's recommended pilot defaults (6x64 net, 10-20k collocation points)
# are kept in configs/full.yaml; on GPU hardware use that instead.
experiment_name: forward_pilot
run_mode: pilot
device: auto
seeds: [0, 1, 2, 3, 4]
branches: auto
n_pilot_branches: 3
param_sets_per_branch: 2
methods: [vanilla, adaptive_weights, adaptive_sampling]
domain:
  z_max: 1.0
network:
  hidden_layers: 4
  width: 40
  activation: tanh
  fourier_features: 0
training:
  adam_steps: 600
  adam_lr: 2.0e-3
  adam_lr_decay: 0.1
  lbfgs_steps: 100
  n_collocation: 1024
  n_initial: 256
  n_boundary: 256
  resample_every: 500
  balancer_alpha: 0.1
  balancer_every: 100
  checkpoint_every: 500
loss_weights: {initial: 100.0, boundary: 100.0, pde: 1.0}
metrics:
  test_grid: [64, 128]
  n_residual_test: 2000
  success_threshold_l2re: 1.0e-2
workers: 3
