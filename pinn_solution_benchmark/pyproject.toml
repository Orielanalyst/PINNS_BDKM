[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pinn_benchmark"
version = "0.1.0"
description = "Audit of iB-function traveling-wave solutions of a 4th-order gain-loss NLS-type equation and a PINN benchmark on the verified solutions"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
    "mpmath>=1.3",
    "torch>=2.0",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
